<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Advisory Board — Settings</title>
  <link rel="stylesheet" href="styles/options.css">
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>Advisory Board Settings</h1>
      <p class="subtitle">Configure your AI-powered business analysis</p>
    </div>

    <div class="card">
      <h2>Anthropic API Key</h2>
      <p class="help-text">
        Your API key is stored locally in your browser and never sent anywhere except Anthropic's API.
        <a href="https://console.anthropic.com/settings/keys" target="_blank" rel="noopener">Get your API key here</a>.
      </p>
      <div class="input-group">
        <input type="password" id="apiKey" placeholder="sk-ant-api03-..." autocomplete="off">
        <button id="toggleKey" class="toggle-btn" title="Show/hide key">Show</button>
      </div>
    </div>

    <div class="card">
      <h2>Model</h2>
      <p class="help-text">Choose the Claude model for analysis. Sonnet is recommended for best results.</p>
      <select id="model">
        <option value="claude-sonnet-4-6">Claude Sonnet 4.6 (Recommended)</option>
        <option value="claude-haiku-4-5-20251001">Claude Haiku 4.5 (Faster, cheaper)</option>
      </select>
    </div>

    <div class="actions">
      <button id="save" class="save-btn">Save Settings</button>
      <span id="status" class="status"></span>
    </div>
  </div>

  <script src="options.js"></script>
</body>
</html>
